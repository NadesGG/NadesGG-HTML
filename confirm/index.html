<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your beta spot — nades.gg</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <style>
    @font-face { font-family: 'Archivo'; font-weight: 400 900; font-display: swap; src: url("/fonts/archivo-latin.woff2") format('woff2'); }
    html, body { margin: 0; background: #F8771C; color: #201e1d; font-family: 'Archivo', system-ui, sans-serif; }
    main { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding-inline: 24px; max-width: 720px; margin: 0 auto; }
    h1 { margin: 0; font-weight: 900; font-size: clamp(40px, 8vw, 84px); line-height: .9; letter-spacing: -.04em; text-transform: uppercase; color: #fff; }
    p { margin: 0; font-size: 18px; font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn { font-family: inherit; font-weight: 800; font-size: 14px; line-height: 1.2; color: #f8f4f4; background: #201e1d; border: 2px solid #201e1d; padding: 8px 14px; text-decoration: none; cursor: pointer; border-radius: 0; }
    .btn:hover { background: #000; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .btn-discord { background: #5865f2; color: #fff; }
    .btn-discord:hover { background: #4752c4; }
    .err { border: 2px solid #201e1d; background: #201e1d; color: #f8f4f4; padding: 12px 16px; font-size: 14px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Lock in<br>your spot.</h1>
    <p id="text">One click and you're on the confirmed beta list.</p>
    <div class="row" id="actions">
      <button class="btn" id="confirm" type="button">Confirm my beta spot</button>
    </div>
    <div class="err" id="error" role="alert" hidden></div>
  </main>

  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const token = new URLSearchParams(location.search).get("t") || "";
    if (!/^[A-Za-z0-9]{6,32}$/.test(token)) {
      $("text").textContent = "This link is missing its code. Reply to the email instead and we'll sort it out.";
      $("actions").hidden = true;
      return;
    }

    // A button press, not a send on page load: mail scanners open every link in an email, and would confirm everyone.
    $("confirm").addEventListener("click", async () => {
      const btn = $("confirm");
      btn.disabled = true;
      $("error").hidden = true;
      try {
        const res = await fetch("https://formspree.io/f/xjyvqwyn", {
          method: "POST",
          headers: { "Accept": "application/json", "Content-Type": "application/json" },
          body: JSON.stringify({ confirm: token, source: "beta confirm", _subject: `Beta confirm: ${token}` })
        });
        const data = await res.json().catch(() => null);
        if (!res.ok) {
          throw new Error((data && data.errors && data.errors[0] && data.errors[0].message) || "");
        }
        $("title").innerHTML = "You're<br>in.";
        $("text").textContent = "Spot confirmed. We'll email you when invites go out.";
        $("actions").innerHTML = '<a class="btn btn-discord" href="https://discord.gg/JF5NWh84xR">Join the Discord</a>';
      } catch (ex) {
        $("error").textContent = ex.message || "Couldn't confirm. Try again, or reply to the email instead.";
        $("error").hidden = false;
        btn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
